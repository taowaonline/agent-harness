name: ci

# PR-level CI. Runs on every push to a pull request and on every push to
# main. Required checks produced by this workflow MUST always report a
# terminal status (success or failure) — never Pending indefinitely — so
# we avoid path filters that would skip the workflow entirely.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harness:
    name: harness checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate harness config
        run: |
          # Plain validate (not --strict): the harness repo intentionally
          # ships fields like max_cost_usd in [evals.*] as documentation
          # of the schema, even though they're not yet enforced. Use
          # `./agent-harness validate --strict` for zero-tolerance checking.
          ./agent-harness validate

      - name: Schema in sync with parser
        run: |
          # config.py is the single source of truth; the checked-in
          # schema must be exactly what schema_gen produces. Drift here
          # is fixed by `./agent-harness gen-schema`, never hand-editing.
          ./agent-harness verify-schema

      - name: Lint (compileall)
        run: |
          ./agent-harness run lint

      - name: Unit tests
        run: |
          ./agent-harness run test-unit

      - name: Integration tests
        run: |
          ./agent-harness run test-integration

      - name: Offline smoke eval
        run: |
          ./agent-harness eval smoke --offline

      - name: Security posture check
        run: |
          ./agent-harness run security

      - name: Upload eval reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports
          path: evals/reports/
          if-no-files-found: ignore
          retention-days: 14
