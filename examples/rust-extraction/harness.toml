# Example: Rust document extraction service.

version = 1

[project]
name = "rust-extraction-demo"
language = "rust"
workload = "extraction"
risk = "standard"

[commands]
bootstrap = [["cargo", "fetch"]]
format = [["cargo", "fmt"]]
lint = [["cargo", "clippy", "--", "-D", "warnings"]]
typecheck = [["cargo", "check", "--all-targets"]]
test-unit = [["cargo", "test", "--lib"]]
test-integration = [["cargo", "test", "--test", "*"]]

[workflows]
check = ["format", "lint", "typecheck", "test-unit"]
release-check = ["check", "test-integration", "eval-full", "security"]

[evals.smoke]
dataset = "../../evals/datasets/smoke.example.jsonl"
sample_limit = 25
min_pass_rate = 0.92

[evals.full]
dataset = "../../evals/datasets/regression.example.jsonl"
repetitions = 1
min_pass_rate = 0.97
max_regression = 0.01

[security]
redact_inputs = true
redact_outputs = true
tool_allowlist = ["retrieve"]
require_approval_for = ["external_write", "delete", "payment", "deploy"]
