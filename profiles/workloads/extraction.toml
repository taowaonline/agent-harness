# Extraction workload profile.
#
# Core metrics:
#   - schema validity rate (output parses against the declared JSON schema)
#   - per-field precision / recall
#   - hallucinated fields (model emits keys not in schema)
#   - re-identification safety (no PII in the extracted output)

[evals.smoke]
dataset = "evals/datasets/extraction.smoke.jsonl"
sample_limit = 25
min_pass_rate = 0.92

[evals.full]
dataset = "evals/datasets/extraction.regression.jsonl"
repetitions = 1   # extraction is mostly deterministic at temperature 0
min_pass_rate = 0.97
max_regression = 0.01
