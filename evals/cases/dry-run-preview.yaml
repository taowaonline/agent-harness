id: dry-run-preview
title: Preview stage order with --dry-run before executing
description: |
  Agent checklist item 3: use `./agent-harness run <stage> --dry-run` to
  preview what will execute. The Agent should propose --dry-run when
  the user wants to inspect order or argv before any side effect.

input:
  prompt: |
    I'm nervous about running `./agent-harness run release-check` for the first
    time on this repo — I want to see exactly what stages and commands
    would run, in order, without any subprocess actually starting. What
    harness invocation gives me that preview? Give the command, don't run.

expect:
  must_contain:
    - "--dry-run"

judge:
  type: rule_based
  success:
    - output_contains:
        all: ["--dry-run", "release-check"]
